.side div.on{background:rgba(120,170,240,.4)}.side hr{border:0;height:10px}

.it{text-align:center;font-size:13.5px;padding:4px 0;border-radius:8px;overflow:hidden}
.it:hover{background:rgba(120,170,240,.16)}.it svg{width:52px;height:52px;display:block;margin:0 auto 6px}.it span{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;padding:0 4px}

#dock a{position:relative;width:50px;height:50px;transition:transform .15s}#dock a:hover{transform:translateY(-6px) scale(1.08)}
#dock svg{width:50px;height:50px}#dock a u{position:absolute;left:22px;bottom:-11px;width:6px;height:6px;border-radius:50%;background:#2a3350;display:none}
.term{background:rgba(251,253,255,.95)}
.tabs{display:flex;align-items:center;gap:8px}
.tab{height:26px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:8px;background:#fff;font-size:13px;box-shadow:0 0 0 1px rgba(120,140,190,.25)}

.tt{flex:1;padding:10px 6px 6px 18px;min-height:0;position:relative}.pane{position:absolute;inset:10px 6px 6px 18px}
.xterm-viewport{background:transparent!important}
.vw{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;min-height:0}.vw img,.vw video{max-width:100%;max-height:100%}
.vw pre{align-self:flex-start;padding:14px;font:13px "JetBrains Mono",monospace;user-select:text;white-space:pre-wrap}
.st{padding:18px 22px;line-height:1.9;font-size:14px}.btn{display:inline-block;padding:7px 16px;margin:10px 8px 0 0;border-radius:9px;background:var(--acc);color:#fff;font-size:13.5px}
iframe{flex:1;border:0;background:#fff}
</style></head><body>
