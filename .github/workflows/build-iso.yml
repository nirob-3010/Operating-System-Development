name: Build NSK OS v0.3

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      with_installer:
        description: "Build with Calamares installer"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build NSK OS v0.3 ISO
    runs-on: ubuntu-24.04

    container:
      image: debian:12

    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC

    steps:

      # ------------------------------------------------------------
      # 1. Checkout source
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install Debian 12 build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-utils \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            shim-signed \
            mtools \
            dosfstools \
            rsync \
            ca-certificates \
            wget \
            curl \
            file \
            git \
            xz-utils \
            gzip \
            bzip2 \
            cpio \
            gnupg \
            apt-utils \
            locales

          rm -rf /var/lib/apt/lists/*

      # ------------------------------------------------------------
      # 3. Show versions
      # ------------------------------------------------------------
      - name: Show build environment
        shell: bash
        run: |
          set -eux

          echo "===== Debian ====="
          cat /etc/debian_version

          echo "===== live-build ====="
          lb --version

          echo "===== xorriso ====="
          xorriso -version | head -n 3

          echo "===== mksquashfs ====="
          mksquashfs -version | head -n 2

      # ------------------------------------------------------------
      # 4. Fix executable permissions
      # ------------------------------------------------------------
      - name: Fix live-build permissions
        shell: bash
        run: |
          set -eux

          chmod +x auto/config
          chmod +x auto/build
          chmod +x auto/clean

          find auto -type f -maxdepth 2 -print

      # ------------------------------------------------------------
      # 5. Clean previous live-build state
      # ------------------------------------------------------------
      - name: Clean live-build
        shell: bash
        run: |
          set -eux

          bash auto/clean || true

          rm -rf \
            cache \
            chroot \
            binary \
            .build \
            config/chroot \
            config/binary \
            config/bootstrap \
            config/common \
            config/archives \
            config/apt \
            config/debian-installer \
            config/bootloaders

      # ------------------------------------------------------------
      # 6. Configure live-build
      # ------------------------------------------------------------
      - name: Configure NSK OS
        shell: bash
        run: |
          set -eux

          bash auto/config

      # ------------------------------------------------------------
      # 7. Verify configuration
      # ------------------------------------------------------------
      - name: Verify live-build configuration
        shell: bash
        run: |
          set -eux

          echo "===== config tree ====="
          find config -maxdepth 3 -type f | sort | head -n 200

          echo "===== live-build config ====="
          lb config --help | grep -E \
            "bootloader|squashfs|compression|iso-hybrid|architectures" \
            || true

      # ------------------------------------------------------------
      # 8. Build ISO
      # ------------------------------------------------------------
      - name: Build NSK OS ISO
        shell: bash
        run: |
          set -eux

          export MKSQUASHFS_OPTIONS="-comp xz -Xbcj x86 -b 1M"

          bash auto/build 2>&1 | tee nsk-os-build.log

      # ------------------------------------------------------------
      # 9. Find generated ISO
      # ------------------------------------------------------------
      - name: Locate ISO
        shell: bash
        run: |
          set -eux

          echo "===== Generated files ====="

          find . \
            -type f \
            \( -name "*.iso" -o -name "*.img" -o -name "*.hybrid.iso" \) \
            -printf "%p %s bytes\n" \
            | sort

      # ------------------------------------------------------------
      # 10. Rename ISO
      # ------------------------------------------------------------
      - name: Prepare ISO artifact
        shell: bash
        run: |
          set -eux

          ISO="$(find . -maxdepth 3 -type f -name '*.iso' | head -n 1)"

          if [ -z "$ISO" ]; then
            echo "ERROR: ISO was not generated."
            exit 1
          fi

          echo "Found ISO: $ISO"

          cp "$ISO" NSK-OS-v0.3-amd64.iso

          ls -lh NSK-OS-v0.3-amd64.iso

      # ------------------------------------------------------------
      # 11. Check ISO size
      # ------------------------------------------------------------
      - name: Check ISO size
        shell: bash
        run: |
          set -eux

          SIZE_BYTES="$(stat -c%s NSK-OS-v0.3-amd64.iso)"
          SIZE_MIB="$((SIZE_BYTES / 1024 / 1024))"

          echo "ISO size: ${SIZE_MIB} MiB"
          echo "ISO size: ${SIZE_BYTES} bytes"

          if [ "$SIZE_BYTES" -gt 524288000 ]; then
            echo ""
            echo "ERROR: ISO is larger than 500 MiB."
            echo "Actual size: ${SIZE_MIB} MiB"
            exit 1
          fi

          echo ""
          echo "ISO is within the 500 MiB target."

      # ------------------------------------------------------------
      # 12. Verify ISO
      # ------------------------------------------------------------
      - name: Verify ISO
        shell: bash
        run: |
          set -eux

          file NSK-OS-v0.3-amd64.iso

          xorriso \
            -indev NSK-OS-v0.3-amd64.iso \
            -report_el_torito plain \
            2>&1 | tee iso-boot-info.txt

      # ------------------------------------------------------------
      # 13. SHA256
      # ------------------------------------------------------------
      - name: Generate SHA256
        shell: bash
        run: |
          set -eux

          sha256sum NSK-OS-v0.3-amd64.iso \
            | tee NSK-OS-v0.3-amd64.iso.sha256

      # ------------------------------------------------------------
      # 14. Upload ISO
      # ------------------------------------------------------------
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NSK-OS-v0.3-amd64
          path: |
            NSK-OS-v0.3-amd64.iso
            NSK-OS-v0.3-amd64.iso.sha256
            iso-boot-info.txt
            nsk-os-build.log
          if-no-files-found: error
          retention-days: 30