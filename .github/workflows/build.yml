name: Build NSK OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            gcc-multilib \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            make

      - name: Verify tools
        run: |
          gcc --version
          grub-mkrescue --version
          xorriso --version
          mformat -V

      - name: Build
        run: |
          make clean
          make

      - name: Verify ISO
        run: |
          test -f build/NSK-OS.iso
          ls -lh build/NSK-OS.iso
          file build/NSK-OS.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NSK-OS
          path: build/NSK-OS.iso
          if-no-files-found: error
