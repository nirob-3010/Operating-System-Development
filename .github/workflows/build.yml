name: Build NSK OS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio gzip xz-utils squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub2-common \
            qemu-system-x86 ovmf file rsync curl ca-certificates

      - name: Build NSK OS
        run: |
          chmod +x scripts/*.sh
          ./scripts/download-base.sh
          ./scripts/build-rootfs.sh
          ./scripts/customize.sh
          ./scripts/configure-ui.sh
          ./scripts/build-iso.sh
          ./scripts/verify-iso.sh

      - name: Upload ISO + metadata
        uses: actions/upload-artifact@v4
        with:
          name: NSK-OS-x86_64
          if-no-files-found: error
          path: |
            NSK-OS.iso
            SHA256SUMS.txt
            build-info.txt

      - name: Print final size summary
        run: |
          echo "ISO SIZE: $(du -h NSK-OS.iso | awk '{print $1}')"
          echo "RAM TARGET: 512 MB–1 GB"
          echo "INSTALLED COMPONENTS: $(paste -sd, .build/components.txt)"
