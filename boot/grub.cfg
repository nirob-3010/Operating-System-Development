set timeout=0
set timeout_style=hidden
set default=0

insmod all_video
insmod gfxterm

# Prefer Full HD; fall back if the emulator cannot expose 1920x1080.
set gfxmode=1920x1080x32,1024x768x32,auto
set gfxpayload=keep

terminal_output gfxterm

menuentry "NSK OS" {
    multiboot /boot/kernel.bin
    boot
}
