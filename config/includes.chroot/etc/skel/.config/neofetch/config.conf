print_info() {
    info title "NSK OS v0.3"
    info "Host" "NSK-PC"
    info "Kernel" "$(uname -r)"
    info "Uptime" "$(uptime -p | sed 's/up //')"
    info "Shell" "$SHELL"
    info "Resolution" "$(xrandr 2>/dev/null | awk '/\*/{print $1; exit}')"
    info "DE" "NSK Desktop"
    info "WM" "Window Manager"
    info "Theme" "Light"
    info "Icons" "Fluent"
    info cols
}
