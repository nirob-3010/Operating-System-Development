backend = "xrender";
vsync = true;
shadow = true;
shadow-radius = 14;
shadow-offset-x = -3;
shadow-offset-y = -3;
shadow-opacity = 0.22;
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
inactive-opacity = 0.98;
frame-opacity = 0.98;
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
opacity-rule = [
  "92:class_g = 'Plank'",
  "92:class_g = 'Xfce4-panel'",
  "90:class_g = 'Conky'"
];
